esphome:
  name: lightning2
  min_version: 2024.6.0
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: dev

esp8266:
  board: d1_mini

# Enable logging
# Logger also watches for AS3935 "Disturber" messages and drives the
# disturber-rate sensor below. The AS3935 misclassifies real lightning as
# disturbers, so we count disturber bursts as the real lightning signal.
logger:
  level: DEBUG
  on_message:
    level: INFO
    then:
      - lambda: |-
          if (strcmp(tag, "as3935") == 0 && strstr(message, "Disturber was detected") != nullptr) {
            id(disturber_bucket_current) += 1;
            int rate = id(disturber_bucket_current) + id(disturber_bucket_previous);
            id(disturber_rate).publish_state(rate);
            id(lightning_nearby).publish_state(rate >= 10);
          }

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Set up a wifi access point
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp8266.yaml@main
  import_full_config: true

# To have a "next url" for improv serial
web_server:

switch:
  - platform: restart
    name: Restart

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

as3935_spi:
  cs_pin: GPIO16
  irq_pin: GPIO5
  indoor: false
  noise_level: 2
  watchdog_threshold: 2
  spike_rejection: 2
  capacitance: 8
  #tune_antenna: True

globals:
  - id: disturber_bucket_current
    type: int
    initial_value: '0'
    restore_value: no
  - id: disturber_bucket_previous
    type: int
    initial_value: '0'
    restore_value: no

# Every 30s, roll the current bucket into previous. Rate = sum of both
# buckets, so we have a sliding 30-60s window of disturber events.
interval:
  - interval: 30s
    then:
      - lambda: |-
          id(disturber_bucket_previous) = id(disturber_bucket_current);
          id(disturber_bucket_current) = 0;
          id(disturber_rate).publish_state(id(disturber_bucket_previous));
          id(lightning_nearby).publish_state(id(disturber_bucket_previous) >= 10);

sensor:
  - platform: as3935
    lightning_energy:
      name: "Lightning Energy"
    distance:
      name: "Storm Distance"
  - platform: template
    name: "Disturber Rate"
    id: disturber_rate
    unit_of_measurement: "/min"
    accuracy_decimals: 0
    update_interval: never
    icon: "mdi:weather-lightning"

binary_sensor:
  - platform: as3935
    name: "Storm Alert"
  - platform: template
    name: "Lightning Nearby"
    id: lightning_nearby
    device_class: problem

