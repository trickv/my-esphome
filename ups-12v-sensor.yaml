esphome:
  name: ups-12v-sensor
  min_version: 2024.6.0
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: dev

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Set up a wifi access point
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp8266.yaml@main
  import_full_config: true

# To have a "next url" for improv serial
web_server:

switch:
  - platform: restart
    name: Restart

# I2C bus on D1 mini default pins (D2=SDA=GPIO4, D1=SCL=GPIO5)
i2c:
  sda: D2
  scl: D1
  scan: true        # logs the addresses found at boot — handy on first power-up

# ADS1115 at default address (ADDR pin to GND)
ads1115:
  - address: 0x48

# CH1 of the divider on A0
sensor:
  - platform: ads1115
    multiplexer: A0_GND          # single-ended A0 vs ground
    gain: 4.096                  # ±4.096V FSR; covers 0–3.3V at A0 with headroom
    name: "12V UPS Voltage (ADS1115)"
    id: ups_voltage_ads
    device_class: voltage
    unit_of_measurement: V
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    filters:
      - multiply: 5.7            # divider compensation: 1/(R2/(R1+R2)) = (47k+10k)/10k
      # CALIBRATION: with 5% resistors, replace 5.7 above with
      #     5.7 * (multimeter_volts / esphome_volts)
      # measured at the same instant on the same rail.
